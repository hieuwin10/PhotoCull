    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gray: {
                750: '#2d3748',
                850: '#1a202c',
                950: '#0d1117',

    <style>
      /* PERFORMANCE OPTIMIZATIONS */
      
      /* GPU Acceleration helpers */
      .transform-gpu {
        transform: translateZ(0);
        backface-visibility: hidden;
        perspective: 1000px;
      }
      
      .backface-hidden {
        backface-visibility: hidden;
      }

      /* Content Visibility - Massive Scroll Performance Boost */
      .content-auto {
        content-visibility: auto;
        contain-intrinsic-size: 0 400px; /* Approximate height of a group to prevent scroll jumping */
      }
      
      /* Hide scrollbar but allow scroll */
      .scrollbar-none::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-none {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      /* Smooth scrolling */
      html {
        scroll-behavior: smooth;
      }
    </style>
